service: restaurant-api

package:
  patterns:
    - '!./**'
    - 'src/**'
    - 'node_modules/**'
    - 'index.js'
    - 'package.json'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${opt:stage, 'dev'}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    RESERVATIONS_TABLE: ${self:service}-reservations-${self:provider.stage}
    MENU_TABLE: ${self:service}-menu-${self:provider.stage}
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    # ✅ Cognito Configuration (used by JWT authorizer, not by Lambda auth handlers)
    COGNITO_USER_POOL_ID: us-east-1_u2c4NVWFd
    COGNITO_CLIENT_ID: 4um4b8gu22hak09cg67d457i32
    COGNITO_REGION: us-east-1
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_u2c4NVWFd
        audience:
          - 4um4b8gu22hak09cg67d457i32 # Old valid client (keep just in case)
          - 5fhkbffpsrjmi930udh68jtpg8 # New Amplify SPA client
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.USERS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.USERS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.RESERVATIONS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.RESERVATIONS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.MENU_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.MENU_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ORDERS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ORDERS_TABLE}/index/*"

functions:
  # ✅ Auth is now handled directly by AWS Amplify on the frontend.
  # All auth Lambda functions (signup, login, refresh, getUser, logout,
  # sendOTP, verifyOTP, resendOTP, setPassword) have been removed.
  # The Cognito JWT authorizer is still used to protect API endpoints.

  # Menu endpoints
  getMenu:
    handler: src/handlers/menu.getMenu
    events:
      - httpApi:
          path: /menu
          method: get

  getMenuItem:
    handler: src/handlers/menu.getMenuItem
    events:
      - httpApi:
          path: /menu/{id}
          method: get

  createMenuItem:
    handler: src/handlers/menu.createMenuItem
    events:
      - httpApi:
          path: /menu
          method: post
          authorizer: cognitoAuthorizer

  updateMenuItem:
    handler: src/handlers/menu.updateMenuItem
    events:
      - httpApi:
          path: /menu/{id}
          method: put
          authorizer: cognitoAuthorizer

  deleteMenuItem:
    handler: src/handlers/menu.deleteMenuItem
    events:
      - httpApi:
          path: /menu/{id}
          method: delete
          authorizer: cognitoAuthorizer

  # Orders endpoints
  createOrder:
    handler: src/handlers/orders.createOrder
    events:
      - httpApi:
          path: /orders
          method: post
          authorizer: cognitoAuthorizer

  getOrders:
    handler: src/handlers/orders.getOrders
    events:
      - httpApi:
          path: /orders
          method: get
          authorizer: cognitoAuthorizer

  getOrder:
    handler: src/handlers/orders.getOrder
    events:
      - httpApi:
          path: /orders/{id}
          method: get
          authorizer: cognitoAuthorizer

  updateOrder:
    handler: src/handlers/orders.updateOrder
    events:
      - httpApi:
          path: /orders/{id}
          method: put
          authorizer: cognitoAuthorizer

  deleteOrder:
    handler: src/handlers/orders.deleteOrder
    events:
      - httpApi:
          path: /orders/{id}
          method: delete
          authorizer: cognitoAuthorizer

  # Health check
  health:
    handler: src/handlers/health.check
    events:
      - httpApi:
          path: /health
          method: get

  # Reservations endpoints
  createReservation:
    handler: src/handlers/reservations.createReservation
    events:
      - httpApi:
          path: /reservations
          method: post
          authorizer: cognitoAuthorizer

  getReservations:
    handler: src/handlers/reservations.getReservations
    events:
      - httpApi:
          path: /reservations
          method: get
          authorizer: cognitoAuthorizer

  getReservation:
    handler: src/handlers/reservations.getReservation
    events:
      - httpApi:
          path: /reservations/{id}
          method: get
          authorizer: cognitoAuthorizer

  updateReservation:
    handler: src/handlers/reservations.updateReservation
    events:
      - httpApi:
          path: /reservations/{id}
          method: put
          authorizer: cognitoAuthorizer

  deleteReservation:
    handler: src/handlers/reservations.deleteReservation
    events:
      - httpApi:
          path: /reservations/{id}
          method: delete
          authorizer: cognitoAuthorizer

plugins:
  - serverless-offline

custom:
  offline:
    httpPort: 3001
    websocketPort: 3002

resources:
  Resources:
    # ✅ DynamoDB Tables (Cognito User Pool is already created separately)
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5
    ReservationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.RESERVATIONS_TABLE}
        AttributeDefinitions:
          - AttributeName: reservationId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: reservationId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 5
              WriteCapacityUnits: 5
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5
    # OTPTable removed — Cognito handles verification codes natively via Amplify.
    MenuTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MENU_TABLE}
        AttributeDefinitions:
          - AttributeName: itemId
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: itemId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: categoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 5
              WriteCapacityUnits: 5
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ORDERS_TABLE}
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 5
              WriteCapacityUnits: 5
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5

  # ✅ Outputs (using existing Cognito User Pool)
  Outputs:
    CognitoUserPoolId:
      Value: ${self:provider.environment.COGNITO_USER_POOL_ID}
      Export:
        Name: ${self:service}-CognitoUserPoolId-${self:provider.stage}
    
    CognitoClientId:
      Value: ${self:provider.environment.COGNITO_CLIENT_ID}
      Export:
        Name: ${self:service}-CognitoClientId-${self:provider.stage}
